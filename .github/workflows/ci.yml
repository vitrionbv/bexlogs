name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (defaults to main)'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel — composer test + vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # DB + Redis env is hoisted to the job level so the post-autoload-dump
    # hook (`php artisan package:discover --ansi`) inside `composer install`
    # connects to the postgres service instead of falling back to the
    # `.env.example` defaults, which point at the dev-only `root/laravel`
    # superuser with no password and trip
    # `SQLSTATE[08006] fe_sendauth: no password supplied`.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: bexlogs
      DB_USERNAME: bexlogs
      DB_PASSWORD: bexlogs
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bexlogs
          POSTGRES_USER: bexlogs
          POSTGRES_PASSWORD: bexlogs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bexlogs -d bexlogs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: laravel

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: pdo_pgsql, intl, zip, bcmath, pcntl, sockets
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: laravel/package-lock.json

      # `.env` must exist before `composer install`: the post-autoload-dump
      # hook runs `php artisan package:discover`, which now triggers Eloquent
      # schema introspection because the User model uses PHP 8 attributes
      # (#[Fillable], #[Hidden]). Without `.env`, Laravel falls back to its
      # default DB_CONNECTION=sqlite and a missing database/database.sqlite
      # makes the bootstrap fail.
      - name: Copy environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate APP_KEY
        run: php artisan key:generate

      - name: Migrate
        run: php artisan migrate --force

      - name: Build frontend
        run: npm run build

      - name: Run composer test
        run: composer test

  scraper:
    name: Scraper — typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - run: npm ci --no-audit --no-fund

      - run: npm run typecheck

      - run: npm run build

  deploy:
    name: Pull, build, redeploy
    needs: [laravel, scraper]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, bexlogs]
    timeout-minutes: 25
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    env:
      APP_DIR: /opt/bexlogs
      COMPOSE: docker compose -f /opt/bexlogs/docker-compose.production.yml --env-file /opt/bexlogs/laravel/.env

    # ─────────────────────────────────────────────────────────────────────
    #  Why the `scraper` service is treated differently from app/queue/
    #  scheduler/reverb in the steps below:
    #
    #  The Laravel containers (app, queue, scheduler, reverb) all run
    #  short request- or worker-bounded units of work — HTTP responses,
    #  redis-queue jobs that finish in seconds, schedule ticks. SIGKILL'ing
    #  one of them mid-deploy loses at most one in-flight HTTP request
    #  (caller retries) or one queued job (Laravel re-dispatches on the
    #  next worker tick). Recreating these on every deploy is fine and
    #  picks up image/env/config changes deterministically.
    #
    #  The scraper container is the opposite: it owns long-running
    #  Playwright/Chromium scrape jobs that take up to ~75 minutes each
    #  (full backfill of a property's BookingExperts log). Recycling the
    #  container mid-job kills the browser, drops every page that was
    #  paginated/parsed-but-not-yet-batched, and the work is *not*
    #  resumable — the next job picks up from the start of the cursor,
    #  not from the partial state we just discarded. Backfill job 38640
    #  was lost this way to the deploy of 5e70d7b (a queue/scheduler
    #  healthcheck-only commit that had no business touching scraper).
    #
    #  Mechanism of the previous bug: this job used to run
    #  `$COMPOSE build app scraper` unconditionally, then
    #  `$COMPOSE up -d`. Even when the scraper source was byte-identical,
    #  the rebuild produced fresh `COPY src ./src` and `npm install`
    #  layers (BuildKit cache bust we don't fully control), which gave
    #  `bexlogs/scraper:latest` a new image SHA, which in turn made
    #  `compose up -d` recreate the scraper container.
    #
    #  Fix: gate the scraper build on two precise signals — whether
    #  `scraper/**` paths changed (build context) and whether the
    #  resolved scraper service config hash changed (YAML block + env
    #  interpolation, exactly what compose itself uses to decide on
    #  recreation). When neither tripped, we skip the build — the
    #  local image SHA stays stable, and `compose up -d` is a no-op
    #  for the scraper service. The running scrape job survives.
    # ─────────────────────────────────────────────────────────────────────

    steps:
      # We deliberately don't use actions/checkout — the runner already has
      # the repo at /opt/bexlogs and that's the working tree we deploy from.
      # Doing a checkout here would create a *second* clone in
      # ${{ github.workspace }} that would never see laravel/.env.
      - name: Resolve target ref
        id: ref
        run: |
          TARGET="${{ github.event.inputs.ref || github.ref_name }}"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Target ref: $TARGET"

      - name: Pull source
        id: pull
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          # Capture the working-tree HEAD and the *resolved* scraper
          # service config hash BEFORE fetching/pulling. We use
          # `compose config --hash scraper` because it's exactly the
          # signal compose itself uses to decide whether a service's
          # container needs recreating: it covers the YAML block plus
          # all interpolated env vars but ignores edits to *other*
          # service blocks. This is more accurate than path-only diffs
          # for compose YAML changes (e.g. a queue:-only healthcheck
          # edit must NOT trigger a scraper rebuild). Capturing
          # github.event.before is unreliable on workflow_dispatch;
          # capturing it from the working tree always works.
          BEFORE_SHA="$(git rev-parse HEAD)"
          # `|| true` guards against pipefail when compose config fails
          # (e.g. a transiently broken pre-pull YAML or missing env file).
          # An empty hash falls through to the rebuild=true branch later.
          BEFORE_SCRAPER_HASH="$( ($COMPOSE config --hash scraper 2>/dev/null || true) | awk '{print $2}')"
          git fetch --all --prune
          git checkout "${{ steps.ref.outputs.target }}"
          git pull --ff-only origin "${{ steps.ref.outputs.target }}"
          AFTER_SHA="$(git rev-parse HEAD)"
          echo "before_sha=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          echo "after_sha=$AFTER_SHA"   >> "$GITHUB_OUTPUT"
          echo "before_scraper_hash=$BEFORE_SCRAPER_HASH" >> "$GITHUB_OUTPUT"
          echo "HEAD now at ${AFTER_SHA:0:7} (was ${BEFORE_SHA:0:7})"
          echo "Scraper config hash pre-pull: ${BEFORE_SCRAPER_HASH:-<unavailable>}"

      # Decide whether the scraper image needs a rebuild on this deploy.
      # See the long comment at the top of this job for the rationale.
      #
      # Triggers a rebuild when ANY of:
      #   - any path under `scraper/**` changed (source, Dockerfile,
      #     package.json, lockfile, …) — the build context's actual
      #     content drives the image SHA, so we MUST rebuild
      #   - the resolved scraper service config hash changed — covers
      #     edits to the `scraper:` block in `docker-compose.production.yml`
      #     AND changes to any env var the scraper interpolates (e.g.
      #     `MAX_CONCURRENT_SCRAPES` in laravel/.env). A pure queue:-block
      #     YAML edit does NOT flip this hash — verified empirically.
      #   - the scraper image isn't built locally yet (cold start /
      #     someone manually pruned the cache)
      #   - we couldn't compute BEFORE_SCRAPER_HASH (compose config
      #     failed pre-pull, e.g. broken YAML or missing env file) —
      #     fall through to rebuild rather than risk a stale image
      #   - it's a workflow_dispatch (manual re-run, operator intent)
      - name: Detect scraper-relevant changes
        id: scraper_changes
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          BEFORE_SHA="${{ steps.pull.outputs.before_sha }}"
          AFTER_SHA="${{ steps.pull.outputs.after_sha }}"
          BEFORE_SCRAPER_HASH="${{ steps.pull.outputs.before_scraper_hash }}"
          AFTER_SCRAPER_HASH="$( ($COMPOSE config --hash scraper 2>/dev/null || true) | awk '{print $2}')"
          echo "Scraper config hash post-pull: ${AFTER_SCRAPER_HASH:-<unavailable>}"

          decide() {
            echo "rebuild=$1" >> "$GITHUB_OUTPUT"
            echo "Decision: rebuild scraper = $1 — $2"
          }

          if ! docker image inspect bexlogs/scraper:latest >/dev/null 2>&1; then
            decide true "bexlogs/scraper:latest not present locally (cold start)"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            decide true "workflow_dispatch — assuming operator wants a fresh build"
            exit 0
          fi

          if [ -z "$BEFORE_SCRAPER_HASH" ] || [ -z "$AFTER_SCRAPER_HASH" ]; then
            decide true "couldn't compute scraper config hash (BEFORE='$BEFORE_SCRAPER_HASH', AFTER='$AFTER_SCRAPER_HASH') — rebuilding to be safe"
            exit 0
          fi

          if [ "$BEFORE_SCRAPER_HASH" != "$AFTER_SCRAPER_HASH" ]; then
            decide true "scraper config hash changed ($BEFORE_SCRAPER_HASH → $AFTER_SCRAPER_HASH)"
            exit 0
          fi

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "$AFTER_SHA" ]; then
            decide false "no commits in $BEFORE_SHA..$AFTER_SHA and scraper config unchanged — skipping scraper rebuild"
            exit 0
          fi

          if ! CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null); then
            decide true "git diff $BEFORE_SHA..$AFTER_SHA failed (history unreachable)"
            exit 0
          fi

          echo "Changed paths in $BEFORE_SHA..$AFTER_SHA:"
          printf '  %s\n' $CHANGED

          if printf '%s\n' "$CHANGED" | grep -qE '^scraper/'; then
            decide true "scraper/** touched (build context changed)"
          else
            decide false "no scraper/** changes and scraper config hash unchanged — skipping scraper rebuild to preserve any in-flight scrape job"
          fi

      - name: Build app image
        working-directory: ${{ env.APP_DIR }}
        run: $COMPOSE build app

      - name: Build scraper image
        if: steps.scraper_changes.outputs.rebuild == 'true'
        working-directory: ${{ env.APP_DIR }}
        run: $COMPOSE build scraper

      - name: Bring stack up
        working-directory: ${{ env.APP_DIR }}
        # `up -d --remove-orphans` is still a blanket up across every
        # service, BUT compose only RECREATES a container when its image
        # SHA or resolved config hash changed. When the scraper image was
        # not rebuilt above and the YAML didn't touch the `scraper:` block,
        # both are stable — compose reports the scraper as up-to-date and
        # leaves the running container (and its in-flight scrape job)
        # untouched. The other services pick up new app-image SHAs / YAML
        # changes as before.
        run: $COMPOSE up -d --remove-orphans

      - name: Wait for app health
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if $COMPOSE exec -T app curl -fsS http://127.0.0.1/up >/dev/null 2>&1; then
              echo "app healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::app did not become healthy within 120s"
          $COMPOSE logs --tail=200 app
          exit 1

      - name: Run migrations
        working-directory: ${{ env.APP_DIR }}
        run: $COMPOSE exec -T app php artisan migrate --force

      - name: Warm caches
        working-directory: ${{ env.APP_DIR }}
        run: |
          $COMPOSE exec -T app php artisan config:cache
          $COMPOSE exec -T app php artisan route:cache
          $COMPOSE exec -T app php artisan view:cache
          $COMPOSE exec -T app php artisan event:cache

      - name: Restart Reverb
        working-directory: ${{ env.APP_DIR }}
        run: |
          $COMPOSE exec -T app php artisan reverb:restart || true
          $COMPOSE restart reverb

      # Deliberately scoped to queue + scheduler. The `scraper` service is
      # NOT restarted here — its container hosts long-running scrape jobs
      # (see the deploy-job header comment). The Laravel queue/scheduler
      # workers re-fetch their dispatched job state from redis, so a hard
      # restart here is safe and necessary to pick up new code.
      - name: Restart queue + scheduler workers
        working-directory: ${{ env.APP_DIR }}
        run: |
          $COMPOSE exec -T app php artisan queue:restart || true
          $COMPOSE restart queue scheduler

      - name: External health check
        if: vars.DEPLOY_DOMAIN != ''
        run: |
          curl -fsSL --retry 10 --retry-delay 3 --max-time 10 \
            "https://${{ vars.DEPLOY_DOMAIN }}/up"

      - name: Notify on failure
        if: failure() && env.NOTIFY_WEBHOOK != ''
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"BexLogs deploy failed: ${{ github.sha }}\"}" \
            "$NOTIFY_WEBHOOK" || true
