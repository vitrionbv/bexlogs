# BexLogs production compose file.
#
# IMPORTANT: this is NOT the file to use for local development — see the
# repo-root docker-compose.yml for that. This file:
#   - exposes only :80 / :443 on the host (via Caddy)
#   - never publishes the postgres/redis/reverb ports outside the docker net
#   - builds one Laravel image and runs it as four roles (app/queue/scheduler/reverb)
#   - persists data to *named* volumes so a `docker compose down` is safe
#
# Everything reads its config from `laravel/.env` (the file the bootstrap
# script generates from `laravel/.env.production.example`). Use:
#
#   docker compose -f docker-compose.production.yml --env-file laravel/.env <cmd>

name: bexlogs

x-app-image: &app_image
  image: bexlogs/app:latest
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    args:
      # Public build-time values for the Vite client bundle. Pulled out of
      # laravel/.env via --env-file. These are NOT secrets — they're baked
      # into the JS that ships to every browser.
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-}
      VITE_REVERB_HOST: ${APP_DOMAIN:-}
      VITE_REVERB_PORT: ${REVERB_PORT:-443}
      VITE_REVERB_SCHEME: ${REVERB_SCHEME:-https}
      VITE_APP_NAME: ${APP_NAME:-BexLogs}

x-app-env: &app_env
  env_file:
    - laravel/.env
  environment:
    # Defaults that the .env almost certainly already sets, but we lock them
    # to internal docker hostnames here so a misconfigured .env can't point
    # the app at someone else's database.
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
      APP_ACME_EMAIL: ${APP_ACME_EMAIL:-admin@localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin Certificate mounted read-only from the host.
      # Placed by the operator at /etc/bexlogs/origin/{origin.crt,origin.key}
      # before the first `docker compose up`.
      - /etc/bexlogs/origin:/etc/caddy/certs:ro
      - bexlogs_caddy_data:/data
      - bexlogs_caddy_config:/config
    networks:
      - bexlogs

  app:
    <<: [*app_image, *app_env]
    restart: unless-stopped
    environment:
      APP_ROLE: app
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Server-side broadcast routing. The Laravel HTTP processes (this
      # container, plus `queue` and `scheduler` since they share the
      # same env block via x-app-env) emit Pusher events to Reverb
      # using these three values. Pointing them at the internal
      # docker-network DNS name `reverb:8080` over plain HTTP keeps
      # synchronous broadcasts (notably `LogBatchInserted`, which is
      # `ShouldBroadcastNow` for live-feed ordering) on a sub-ms
      # round-trip. They explicitly OVERRIDE whatever `laravel/.env`
      # sets for REVERB_HOST / PORT / SCHEME — Compose's `environment`
      # block wins over `env_file`, which is the whole point of
      # repeating these here.
      #
      # The browser bundle still talks to Reverb via the public
      # hostname: that's what the `VITE_REVERB_*` build args at the
      # top of this file bake in (CDN → Caddy → reverb), and they
      # are the only Reverb-related vars baked into the JS that
      # ships to clients. Do NOT collapse the two into one var —
      # they have to differ.
      #
      # Pre-fix, all containers broadcast via the public hostname,
      # which round-tripped through Cloudflare → Caddy → ingress
      # back into the same docker network. A single 10s WAN timeout
      # inside `WorkerController::batch` was returning 500 to the
      # scraper and failing the worker job (the data write itself
      # had succeeded). Defense-in-depth on top of this routing
      # change: every `broadcast()` in the worker-path controllers
      # is now wrapped in `App\Support\SafeBroadcast::dispatch` so
      # broadcast failures log a warning but never fail the data
      # mutation — see WorkerController / JobsController.
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - bexlogs_storage:/var/www/html/storage
    networks:
      - bexlogs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  queue:
    <<: [*app_image, *app_env]
    restart: unless-stopped
    environment:
      APP_ROLE: queue
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Internal docker-network broadcasting. Same rationale as
      # the `app` service — queued listeners that broadcast
      # (`ShouldBroadcast` events processed off the redis queue)
      # would otherwise round-trip through the public hostname
      # exactly like the synchronous `ShouldBroadcastNow` path
      # that took down job 38616. See `app` for the full block.
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - bexlogs_storage:/var/www/html/storage
    networks:
      - bexlogs
    # Process-liveness check. This container inherits the
    # `curl http://127.0.0.1/up` HEALTHCHECK from docker/app/Dockerfile,
    # which would always fail here — `queue:work` doesn't run an HTTP
    # listener. We override with a pgrep against the artisan worker's
    # argv (`pgrep -f` matches the full command line).
    #
    # CMD form (not CMD-SHELL) is deliberate. The app image ships
    # BusyBox pgrep v1.37 (`/usr/bin/pgrep`): `-c` does not exist
    # there (only `-flanovx`), and `-f` does NOT exclude the calling
    # parent shell — so a CMD-SHELL wrapper always self-matches via
    # the `sh -c "pgrep -f 'artisan …'"` argv (false positive even
    # when the worker is dead). Invoking pgrep directly skips the
    # shell entirely; pgrep already excludes its own PID, leaving
    # only the worker(s) as matchable processes.
    #
    # The `scraper` service further down uses a CMD-SHELL form with
    # `pgrep -fc` because its image ships procps-ng pgrep, where
    # both `-c` and parent-shell exclusion work. Do NOT copy this
    # block's form to scraper or vice versa without re-checking the
    # base image's pgrep flavour.
    #
    # Supersedes commit 70cda58 which used the broken CMD-SHELL form.
    healthcheck:
      test: ["CMD", "pgrep", "-f", "artisan queue:work"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  scheduler:
    <<: [*app_image, *app_env]
    restart: unless-stopped
    environment:
      APP_ROLE: scheduler
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Internal broadcasting routing — same as `app` and `queue`.
      # The scheduler runs `php artisan schedule:work`, which fires
      # `ScrapeReapStale` etc. inline; those commands broadcast
      # status updates and would otherwise round-trip via the
      # public hostname.
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - bexlogs_storage:/var/www/html/storage
    networks:
      - bexlogs
    # Process-liveness check. This container inherits the
    # `curl http://127.0.0.1/up` HEALTHCHECK from docker/app/Dockerfile,
    # which would always fail here — `schedule:work` doesn't run an HTTP
    # listener. We override with a pgrep against the artisan worker's
    # argv (`pgrep -f` matches the full command line).
    #
    # CMD form (not CMD-SHELL) is deliberate; see the long comment
    # on the `queue` service above for the BusyBox-vs-procps-ng
    # rationale. Short version: the app image's pgrep is BusyBox
    # which lacks `-c` AND matches the calling shell's own argv,
    # so any CMD-SHELL wrapper would always self-match the pattern.
    # CMD form skips the shell, pgrep excludes its own PID, only
    # the worker(s) are matchable.
    #
    # Supersedes commit 70cda58 which used the broken CMD-SHELL form.
    healthcheck:
      test: ["CMD", "pgrep", "-f", "artisan schedule:work"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  reverb:
    <<: [*app_image, *app_env]
    restart: unless-stopped
    environment:
      APP_ROLE: reverb
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Skip the artisan cache warm-up in the WebSocket process — its hot
      # path doesn't touch routes/views/events anyway.
      SKIP_ARTISAN_CACHE: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - bexlogs_storage:/var/www/html/storage
    networks:
      - bexlogs
    # Reverb listens on 8080 (set via REVERB_SERVER_PORT in
    # laravel/.env), NOT 80. Previously this service had no
    # healthcheck and Docker inferred liveness from the
    # `app` service's php-fpm `/up` probe, which obviously
    # said nothing about whether reverb itself was up.
    #
    # Pusher's HTTP layer answers WebSocket upgrades on `/`
    # and returns 4xx for plain GETs — that's still proof of
    # liveness (the TCP listener is accepting connections),
    # so we deliberately omit `--fail` and just check that
    # curl gets ANY response. Connection-refused / timeout
    # → non-zero exit → Docker marks unhealthy. The
    # `--connect-timeout 5` keeps a wedged kernel from
    # holding the probe past the healthcheck timeout window.
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "--connect-timeout", "5", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  scraper:
    image: bexlogs/scraper:latest
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    # Run Docker's tini as PID 1. The scraper's own Dockerfile starts
    # `node dist/index.js` directly, and Node is not a real init — it
    # does not reap orphaned children. Playwright launches Chromium,
    # which itself spawns ~30 subprocesses (zygote, gpu, utility,
    # crashpad_handler, …). Whenever a Chromium instance crashes
    # mid-scrape its surviving children get re-parented to PID 1
    # (Node), which never wait(2)s them. They accumulate as defunct
    # entries against the container's cgroup `pids.max`; once we hit
    # the cap every `browser.launch()` returns `spawn … EAGAIN` and
    # all subsequent jobs fail. `init: true` tells Docker to inject
    # tini ahead of our command, and tini reaps orphans every time
    # it gets `SIGCHLD`. The other services (app/queue/reverb/
    # scheduler) already get tini from the PHP image's entrypoint.
    init: true
    # Defense-in-depth on top of `init: true` for the orphan-Chromium
    # postmortem. With MAX_CONCURRENT_SCRAPES at the recommended
    # ceiling and tini reaping correctly, the working set sits well
    # under 200 PIDs. 1024 leaves a 5x safety margin and means any
    # future leak — Chromium subprocess crash that tini somehow
    # misses, a runaway shell-out, anything — hits a hard cgroup
    # wall instead of OOMing the host's PID table. RSS is similarly
    # bounded: each concurrent Playwright job runs its own Chromium
    # (~300–500MB RSS in the cgroup). Six heavy jobs at once OOM'd
    # the 2g cap on 2026-05-22; keep MAX_CONCURRENT_SCRAPES at 4
    # and mem_limit at 3g so two EuroParcs backfills can coexist
    # with a couple of scheduled scrapes without killing the worker.
    #
    # Operator note: the live PID count for this container is
    # readable inside it at `/sys/fs/cgroup/pids.current`, and the
    # cap at `/sys/fs/cgroup/pids.max`. A cheap Datadog/Prometheus
    # exporter could scrape `pids.current / pids.max` and alert at
    # 0.6 to catch a creeping leak before it bites. Not wiring that
    # here — just leaving the breadcrumb.
    pids_limit: 1024
    mem_limit: 3g
    depends_on:
      app:
        condition: service_healthy
    environment:
      LARAVEL_BASE_URL: http://app:80
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?WORKER_API_TOKEN must be set}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      MAX_CONCURRENT_SCRAPES: ${MAX_CONCURRENT_SCRAPES:-4}
      MAX_PAGES_PER_JOB: ${MAX_PAGES_PER_JOB:-2000}
      BATCH_SIZE: ${BATCH_SIZE:-100}
      HEADLESS: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
    networks:
      - bexlogs
    # Process-liveness check. The scraper has no HTTP endpoint to
    # probe, so we look for the Node entrypoint by command line.
    #
    # `pgrep -f` matches against the full argv. We anchor with
    # `^node ` so the pattern matches the worker's own argv
    # (`node dist/index.js`) but does NOT false-match the
    # healthcheck shell process itself: that process's cmdline
    # starts with `[ "$(pgrep …)" -ge 1 ]`, which doesn't begin
    # with `node `, so the count comes back 0 when the worker
    # is dead.
    #
    # `pgrep -x node` would be the obvious alternative but
    # doesn't work for Node specifically: V8 / libuv rename the
    # process's `comm` field to `MainThread`, which `pgrep -x`
    # matches against rather than the executable name. The argv
    # match via `-f` is the reliable form.
    #
    # Playwright's Chromium child processes do NOT run as `node`
    # (they're chromium binaries), so the count is bounded by
    # however many node entrypoints we run — which is exactly 1
    # in this image. The 60s interval is plenty: a dead worker
    # process recovers via `restart: unless-stopped` on the next
    # tick; we don't need second-level granularity here.
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(pgrep -fc '^node ')\" -ge 1 ]"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE must be set}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    # Postgres 18's docker image expects the mount at /var/lib/postgresql,
    # NOT /var/lib/postgresql/data — data now lives at
    # /var/lib/postgresql/18/docker/ inside the mount, which lets
    # pg_upgrade --link work across major versions without mount-point
    # boundary issues. (See github.com/docker-library/postgres/pull/1259.)
    volumes:
      - bexlogs_pg_data:/var/lib/postgresql
    networks:
      - bexlogs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - bexlogs_redis_data:/data
    networks:
      - bexlogs
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  bexlogs:
    driver: bridge

volumes:
  bexlogs_pg_data:
  bexlogs_redis_data:
  bexlogs_caddy_data:
  bexlogs_caddy_config:
  bexlogs_storage:
